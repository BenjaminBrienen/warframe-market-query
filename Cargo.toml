[package]
name = "wfmq"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wfmq"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
jod-thread = "1.0.0"
reqwest = { version = "0.13.5", features = ["json"] }
rodio = {
  version = "0.23.0",
}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls", "rustls-tls-webpki-roots"] }
