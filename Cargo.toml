[package]
name = "wfmq"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wfmq"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
jod-thread = "1.0.0"
reqwest = { version = "0.13.5", features = ["json"] }
rodio = {
  version = "0.23.0",
}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls", "rustls-tls-webpki-roots"] }

[lints.clippy]
# often hurts readability
absolute_paths = "allow"
# does not allow test module to be at bottom of file
arbitrary_source_item_ordering = "allow"
# not a good general rule for the cost it entails
arithmetic_side_effects = "allow"
# makes it easier to keep up to date with new lints
blanket_clippy_restriction_lints = "allow"
cargo = { level = "warn", priority = -2 }
# not important
cargo_common_metadata = "allow"
cast_precision_loss = "allow"
complexity = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
# needs to be determined on a case-by-case basis
default_numeric_fallback = "allow"
# conflicting with redundant_else
else_if_without_else = "allow"
# wgsl-analyzer has no stability commitment
exhaustive_enums = "allow"
# wgsl-analyzer has no stability commitment
exhaustive_structs = "allow"
expect_used = "allow"
# unwanted restriction
field_scoped_visibility_modifiers = "allow"
# is fine
float_arithmetic = "allow"
# unidiomatic
implicit_return = "allow"
# prefer get().expect() so that the reason is documented
indexing_slicing = "allow"
# do not care
inline_modules = "allow"
# this is not a cryptographic context
integer_division_remainder_used = "allow"
# incorrect
items_after_statements = "allow"
iter_over_hash_type = "allow"
# always covered by min_ident_chars
many_single_char_names = "allow"
missing_assert_message = "allow"
# TODOs
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
# is this helpful enough?
missing_inline_in_public_items = "allow"
# antipattern
missing_trait_methods = "allow"
module_name_repetitions = "allow"
# not under this crate's control
multiple_crate_versions = "allow"
multiple_inherent_impl = "allow"
needless_raw_string_hashes = "allow"
# expect-test has a special integration with raw string
needless_raw_strings = "allow"
nursery = { level = "warn", priority = -2 }
# nursery, ugly suggestions
option_if_let_else = "allow"
panic = "allow"
panic_in_result_fn = "allow"
pattern_type_mismatch = "allow"
pedantic = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -2 }
# often useful
pub_use = "allow"
# style preference
pub_with_shorthand = "allow"
# unidiomatic
question_mark_used = "allow"
# unwanted restriction
redundant_pub_crate = "allow"
restriction = { level = "warn", priority = -2 }
# style preference
self_named_module_files = "allow"
# style preference
semicolon_outside_block = "allow"
# style preference
separated_literal_suffix = "allow"
# often useful
shadow_reuse = "allow"
# not useful
shadow_same = "allow"
# do not care
shadow_unrelated = "allow"
# good for organization
single_call_fn = "allow"
# no no_std support
std_instead_of_alloc = "allow"
# no no_std support
std_instead_of_core = "allow"
string_slice = "allow"
struct_excessive_bools = "allow"
style = { level = "warn", priority = -2 }
suspicious = { level = "warn", priority = -2 }
# poor general recommendation/style
unneeded_field_pattern = "allow"
unwrap_in_result = "allow"
unwrap_used = "allow"

[lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = { level = "deny", priority = -1 }
rust_2018_compatibility = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unused = { level = "allow", priority = 1 }
warnings = { level = "warn", priority = -2 }

[lints.rustdoc]
bare_urls = "warn"
broken_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags = "warn"
invalid_rust_codeblocks = "warn"
missing_crate_level_docs = "warn"
# missing_doc_code_examples = "warn"
private_doc_tests = "warn"
private_intra_doc_links = "allow"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"
